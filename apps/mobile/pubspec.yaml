name: music_dna
description: "MusicDNA Flutter mobile app."
publish_to: "none"
version: 0.1.2+16

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  google_fonts: ^6.3.1
  go_router: ^16.0.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.1
  url_launcher: ^6.3.2
  flutter_svg: 2.3.4
  share_plus: 11.1.0
  path_provider: 2.1.6
  xml: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/copy/critic-fillers.json
    - assets/branding/music-dna-logo.png
    - assets/imagery/music-dna-cover.jpg
