<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="100%" height="100%" fill="#14110f"/><rect x="60" y="60" width="960" height="960" fill="none" stroke="#e8b04a" stroke-width="3"/><text x="90" y="170" font-family="monospace" font-size="34" letter-spacing="8" fill="#e8b04a">MUSICDNA · THE CRITIC'S READ</text><text x="90" y="300" font-family="Georgia, serif" font-size="68" fill="#f4efe6">You keep returning to</text><text x="90" y="378.2" font-family="Georgia, serif" font-size="68" fill="#f4efe6">the songs that leave the</text><text x="90" y="456.4" font-family="Georgia, serif" font-size="68" fill="#f4efe6">whole room a little</text><text x="90" y="534.6" font-family="Georgia, serif" font-size="68" fill="#f4efe6">different after the</text><text x="90" y="612.8" font-family="Georgia, serif" font-size="68" fill="#f4efe6">lights go down.</text><text x="90" y="791" font-family="monospace" font-size="34" letter-spacing="6" fill="#e8b04a">THE WITNESS</text><text x="90" y="871" font-family="Georgia, serif" font-size="40" fill="#c9c2b6">— Roads over Protection</text><text x="90" y="927" font-family="Georgia, serif" font-size="40" fill="#c9c2b6">— The ache over the embrace</text><text x="90" y="983" font-family="Georgia, serif" font-size="40" fill="#c9c2b6">— Space over urgency</text><text x="90" y="970" font-family="monospace" font-size="32" fill="#c9c2b6">musicdna.fm</text></svg>